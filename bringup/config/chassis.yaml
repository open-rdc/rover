# 共通パラメータ（複数のノードから読むため）
chassis_driver_node:
  ros__parameters:
    linear_max_vel: 1.0
    angular_max_vel: 90.0
    serial_port: "/dev/ttyCNT"
    wheel_radius : 0.1125
    tread : 0.25
    # pole_pairs: 23
    pole_pairs: 15

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1  # ボタンの割り当て
    scale_linear:
      x: 1.0

    axis_angular:
      yaw: 2  # ボタンの割り当て
    scale_angular:
      yaw: 1.5

    enable_button: 6
